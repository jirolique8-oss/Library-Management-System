<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" font-family="Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #1a1a1a; }
    .subtitle { font-size: 12px; fill: #555; }
    .start-end { fill: #e8f4ea; stroke: #2d6a4f; stroke-width: 2; }
    .process { fill: #eaf2fb; stroke: #1d4ed8; stroke-width: 2; }
    .io { fill: #fdf3e7; stroke: #b45309; stroke-width: 2; }
    .label { font-size: 13px; fill: #1a1a1a; text-anchor: middle; }
    .label-b { font-size: 13px; fill: #1a1a1a; text-anchor: middle; font-weight: 600; }
    .arrow { stroke: #1a1a1a; stroke-width: 1.8; fill: none; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect width="700" height="620" fill="#ffffff"/>
  <text x="350" y="40" class="title" text-anchor="middle">8. Exit — Flowchart</text>
  <text x="350" y="60" class="subtitle" text-anchor="middle">main.py → choice == "8" → break out of main loop</text>

  <!-- Start -->
  <ellipse cx="350" cy="110" rx="80" ry="28" class="start-end"/>
  <text x="350" y="115" class="label-b">Start</text>
  <line x1="350" y1="138" x2="350" y2="170" class="arrow" marker-end="url(#arr)"/>

  <!-- choose 8 -->
  <rect x="220" y="170" width="260" height="50" rx="4" class="process"/>
  <text x="350" y="195" class="label">Display menu and read</text>
  <text x="350" y="212" class="label">user choice = "8"</text>
  <line x1="350" y1="220" x2="350" y2="252" class="arrow" marker-end="url(#arr)"/>

  <!-- Print closing message -->
  <polygon points="220,252 480,252 460,302 240,302" class="io"/>
  <text x="350" y="282" class="label">Output: "Program closed."</text>
  <line x1="350" y1="302" x2="350" y2="334" class="arrow" marker-end="url(#arr)"/>

  <!-- Break loop -->
  <rect x="220" y="334" width="260" height="60" rx="4" class="process"/>
  <text x="350" y="358" class="label">Execute break statement</text>
  <text x="350" y="376" class="label">Exit the while-True loop</text>
  <line x1="350" y1="394" x2="350" y2="426" class="arrow" marker-end="url(#arr)"/>

  <!-- Terminate -->
  <rect x="220" y="426" width="260" height="60" rx="4" class="process"/>
  <text x="350" y="450" class="label">Program execution ends</text>
  <text x="350" y="468" class="label">(returns to operating system)</text>
  <line x1="350" y1="486" x2="350" y2="518" class="arrow" marker-end="url(#arr)"/>

  <!-- End -->
  <ellipse cx="350" cy="548" rx="80" ry="28" class="start-end"/>
  <text x="350" y="553" class="label-b">End</text>

  <!-- Legend -->
  <g transform="translate(40,590)">
    <rect x="0" y="0" width="22" height="14" class="start-end"/>
    <text x="28" y="11" font-size="11" fill="#333">Start/End</text>
    <rect x="100" y="0" width="22" height="14" class="process"/>
    <text x="128" y="11" font-size="11" fill="#333">Process</text>
    <polygon points="200,0 222,0 218,14 196,14" class="io"/>
    <text x="228" y="11" font-size="11" fill="#333">Input/Output</text>
  </g>
</svg>